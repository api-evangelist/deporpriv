name: DeporPrivé
description: >-
  DeporPrivé is a Mexico-based sports e-commerce platform operating as a
  members-oriented "Sport Experience & Outlet" that runs flash sales and
  private, time-limited shopping events across more than 300 athletic brands
  including Adidas, Nike, and Salomon, with discounts reaching up to 70%.
  Founded in 2016 and headquartered in Mexico, the company curates footwear,
  apparel, and accessories for running, cycling, swimming, football, and
  general fitness, and has grown into one of the largest sport-specific online
  retailers in the country, fulfilling around 1,000 packages per day across
  multiple sales channels. It is tracked in the API Evangelist network as a
  portfolio company of 500 Global. No public developer program, API, or
  documentation surface has been identified for this consumer retail brand.
